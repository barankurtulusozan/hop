apiVersion: apps/v1
kind: Deployment
metadata:
  name: hop-core-deployment
  namespace: hop-system
  labels:
    app.kubernetes.io/name: hop-core
    app.kubernetes.io/part-of: hop-enterprise-platform
spec:
  replicas: 3
  selector:
    matchLabels:
      app: hop-core
  template:
    metadata:
      labels:
        app: hop-core
    spec:
      containers:
      - name: hop-core
        image: ghcr.io/enterprise/hop-core:latest
        ports:
        - containerPort: 8000
          name: http
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "2000m"
            memory: "2Gi"
        livenessProbe:
          exec:
            command: ["python", "-m", "src.cli.main", "queue_status"]
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          exec:
            command: ["python", "-m", "src.cli.main", "queue_status"]
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: hop-core-service
  namespace: hop-system
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: hop-core
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hop-core-hpa
  namespace: hop-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hop-core-deployment
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75
