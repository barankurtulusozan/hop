version: '3.8'

services:
  hop-core:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - HOP_ENV=production
      - LOG_LEVEL=INFO
      - OPENAI_API_KEY=${OPENAI_API_KEY:-mock-key}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-mock-key}
    healthcheck:
      test: ["CMD", "python", "-m", "src.cli.main", "queue_status"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
